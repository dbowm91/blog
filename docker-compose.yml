services:
  blog:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    volumes:
      - blog_data:/home/blog/instance
      - blog_logs:/home/blog/logs
      - blog_uploads:/home/blog/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - blog_uploads:/home/blog/app/static/uploads:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      blog:
        condition: service_healthy
    profiles:
      - production

  backup:
    build: .
    restart: unless-stopped
    volumes:
      - blog_data:/home/blog/instance:ro
      - ./backups:/backups
    working_dir: /home/blog
    entrypoint: ["python3", "backup.py"]
    environment:
      - BACKUP_DIR=/backups
    profiles:
      - backup

volumes:
  blog_data:
    name: blog_data
  blog_logs:
    name: blog_logs
  blog_uploads:
    name: blog_uploads

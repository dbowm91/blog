services:
  blog:
    build: .
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "DevLog Blog"
      org.opencontainers.image.description: "Flask blog CMS with admin dashboard, newsletter scheduling, and FTS5 search"
    expose:
      - "5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI:-}
      # Set to "production" to enable Redis caching (default: development)
      - FLASK_ENV=${FLASK_ENV:-production}
      # SMTP configuration (also used by APScheduler for newsletter)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}  # String "true" is truthy in Flask
      # Redis for Celery broker and Flask-Caching
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Flask-Caching (defaults to redis://localhost:6379/0, override if needed)
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-}
      # Celery configuration (uses REDIS_URL if not set)
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      # Health check endpoint secret (optional, for detailed health info)
      - HEALTH_CHECK_SECRET=${HEALTH_CHECK_SECRET:-}
      # API key for REST API authentication
      - API_KEY=${API_KEY:-}
      # Number of proxies (for ProxyFix middleware, default: 1)
      - PROXY_COUNT=${PROXY_COUNT:-1}
    volumes:
      - blog_data:/home/blog/instance
      - blog_logs:/home/blog/logs
      - blog_uploads:/home/blog/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - production
    depends_on:
      redis:
        condition: service_healthy

  # WARNING: APScheduler runs on all replicas. Scaling celery beyond 1 container
  # without external job coordination (Redis, etcd) will cause duplicate job execution.
  # See app/scheduler.py lines 3-8 for details.
  celery:
    build: .
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "DevLog Celery Worker"
      org.opencontainers.image.description: "Async task worker for newsletters, backups, and scheduled jobs"
    # Single concurrency to prevent duplicate newsletter sends and webhook deliveries
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - PYTHONPATH=/home/blog
    volumes:
      - blog_data:/home/blog/instance
      - blog_logs:/home/blog/logs
      - blog_uploads:/home/blog/app/static/uploads
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - production

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - blog_uploads:/home/blog/app/static/uploads:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      blog:
        condition: service_healthy
    profiles:
      - production

  backup:
    build: .
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "DevLog Backup"
      org.opencontainers.image.description: "Database and file backup service"
    volumes:
      - blog_data:/home/blog/instance:ro
      - ./backups:/backups
    working_dir: /home/blog
    entrypoint: ["python3", "backup.py"]
    environment:
      - BACKUP_DIR=/backups
      # Required for backup.py to import app.services:
      - PYTHONPATH=/home/blog
      # SECRET_KEY needed for Flask app config when importing app modules
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      # BACKUP_ENCRYPTION_KEY for encrypted backups (loaded from config.toml in app)
      # WEBHOOK_ENCRYPTION_KEY for webhook secrets (loaded from config.toml in app)
    profiles:
      - backup

volumes:
  blog_data:
    name: blog_data
  blog_logs:
    name: blog_logs
  blog_uploads:
    name: blog_uploads

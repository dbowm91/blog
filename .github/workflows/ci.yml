name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app/ devlog_cli/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run tests with coverage
        env:
          ADMIN_PASSWORD: test-password-123
          SECRET_KEY: test-secret-key-test-secret-key-1234
        run: python -m pytest tests/ --ignore=tests/e2e -v --cov=app --cov-fail-under=75

  theme-policy:
    name: Theme Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Theme accessibility strict check
        run: python scripts/theme_accessibility_report.py --strict

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run migration chain tests
        env:
          SECRET_KEY: test-secret-key-ci-32-chars-minimum-here
          ADMIN_PASSWORD: ci-test-password
        run: python -m pytest tests/test_migration_chain.py tests/test_migration_drop_theme_preset.py -v

  theme-package-verification:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify theme package
        run: python scripts/verify_theme_package.py dist/*.whl

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install 'pip-audit>=2.10.1,<3.0'

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt -S

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devlog:ci .

      - name: Verify Vite manifest in image
        run: docker run --rm devlog:ci test -f /home/blog/app/static/dist/.vite/manifest.json

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=test-secret-key-test-secret-key-1234
          ADMIN_PASSWORD=test-password-123
          ENABLE_SCHEDULER=false
          EOF

      - name: Build and start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production up -d --build

      - name: Wait for blog to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          ADMIN_PASSWORD: test-password-123
          SECRET_KEY: test-secret-key-test-secret-key-1234
          E2E_BASE_URL: http://localhost:5000
        run: python -m pytest tests/e2e/ -v

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs blog
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs redis
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs celery || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production down -v

  dependency-consistency:
    name: Dependency Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dependency manifest consistency
        run: python scripts/check_dependency_manifest_consistency.py

  release1-package-smoke:
    name: Release Package Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Build wheel
        run: python -m build --wheel

      - name: Create isolated venv and install wheel
        run: |
          python -m venv /tmp/devlog-r1
          /tmp/devlog-r1/bin/pip install dist/*.whl

      - name: Smoke test CLI
        env:
          SECRET_KEY: release-smoke-secret-key-32-chars-minimum
          ADMIN_PASSWORD: release-smoke-password
          DEVLOG_DATA_DIR: /tmp/devlog-r1-data
        run: |
          unset PYTHONPATH
          mkdir -p "${DEVLOG_DATA_DIR}"
          cd /tmp
          /tmp/devlog-r1/bin/devlog --version
          /tmp/devlog-r1/bin/devlog config init --profile development --output /tmp/devlog-config.toml

          # config check exits 8 (degraded) when it reports warnings only.
          set +e
          /tmp/devlog-r1/bin/devlog --config /tmp/devlog-config.toml config check
          CHECK_EXIT=$?
          set -e
          if [ "${CHECK_EXIT}" -ne 0 ] && [ "${CHECK_EXIT}" -ne 8 ]; then
            echo "ERROR: config check failed with exit ${CHECK_EXIT}" >&2
            exit 1
          fi

          /tmp/devlog-r1/bin/devlog --config /tmp/devlog-config.toml themes list

      - name: Smoke test app-context operation
        env:
          SECRET_KEY: release-smoke-secret-key-32-chars-minimum
          ADMIN_PASSWORD: release-smoke-password
          DEVLOG_DATA_DIR: /tmp/devlog-r1-data
        run: |
          unset PYTHONPATH
          mkdir -p "${DEVLOG_DATA_DIR}"
          cd /tmp
          /tmp/devlog-r1/bin/devlog --config /tmp/devlog-config.toml db status

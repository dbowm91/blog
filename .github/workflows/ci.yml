name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          ADMIN_PASSWORD: test-password-123
          SECRET_KEY: test-secret-key-test-secret-key-1234
        run: python -m pytest tests/ --ignore=tests/e2e -v --cov=app --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --fail-on=all

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devlog:ci .

      - name: Verify Vite manifest in image
        run: docker run --rm devlog:ci test -f /app/app/static/dist/.vite/manifest.json

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=test-secret-key-test-secret-key-1234
          ADMIN_PASSWORD=test-password-123
          SESSION_COOKIE_SECURE=false
          ENABLE_SCHEDULER=false
          EOF

      - name: Build and start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production up -d --build

      - name: Wait for blog to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pytest-playwright
          playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          ADMIN_PASSWORD: test-password-123
          SECRET_KEY: test-secret-key-test-secret-key-1234
          E2E_BASE_URL: http://localhost:5000
        run: python -m pytest tests/e2e/ -v

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs blog
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs redis
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production logs celery || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile production down -v

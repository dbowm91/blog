{% extends "admin/login_base.html" %}

{% block content %}
<div class="login-page">
    <div class="login-card animate-in">
        <h1>New Password</h1>
        <p class="login-subtitle">Enter your new password below.</p>
        <form method="POST" class="login-form" data-loading data-loading-text="Resetting...">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" autofocus>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
        <div class="login-footer-links">
            <a href="{{ url_for('admin.login') }}">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

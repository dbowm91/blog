{% extends "admin/login_base.html" %}

{% block content %}
<h1>Two-Factor Authentication</h1>
<p>Enter the 6-digit code from your authenticator app:</p>

<form method="POST" action="{{ url_for('admin.login_2fa') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="token">Verification Code</label>
        <input type="text" name="token" id="token" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}">
    </div>
    <button type="submit" class="btn btn-primary">Verify</button>
</form>

<p class="help-text">
    <a href="{{ url_for('admin.login') }}">Back to login</a>
</p>
{% endblock %}

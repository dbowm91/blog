<!DOCTYPE html>
<html lang="en" data-syntax-theme="{{ syntax_theme or 'okaidia' }}" data-prism-css-url="{{ vite_asset('css/' + syntax_theme + '.css') }}">
<head>
    <script nonce="{{ csp_nonce }}">
        (function() {
            var defaultScheme = '{{ theme_default_scheme | e }}';
            if (defaultScheme !== 'system' && defaultScheme !== 'dark' && defaultScheme !== 'light') {
                defaultScheme = 'system';
            }
            var s = localStorage.getItem('blog-color-scheme');
            var scheme = (s === 'system' || s === 'dark' || s === 'light') ? s : defaultScheme;
            var effective = scheme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : scheme;
            document.documentElement.setAttribute('data-color-scheme', effective);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Admin | {{ site_title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ vite_asset('img/favicon.svg') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/' + syntax_theme + '.css') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/base.css') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/layout.css') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/admin.css') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/forms.css') }}">
    <link rel="stylesheet" href="{{ vite_asset('css/utilities.css') }}">
    <style nonce="{{ csp_nonce }}">
        :root,
        [data-color-scheme="dark"] {
            {% for key, value in theme_dark_vars.items() %}
            {% if key != 'name' %}
            --{{ key }}: {{ value }};
            {% endif %}
            {% endfor %}
        }

        [data-color-scheme="light"] {
            {% for key, value in theme_light_vars.items() %}
            {% if key != 'name' %}
            --{{ key }}: {{ value }};
            {% endif %}
            {% endfor %}
        }

        {% if custom_css_enabled and custom_css %}
        {{ custom_css | sanitize_css | safe }}
        {% endif %}
    </style>
</head>
<body class="admin-body">
    <div id="sr-announce" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container container" role="status" aria-live="polite">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">
                        <span class="flash-message">{{ message }}</span>
                        <button class="flash-close" aria-label="Dismiss">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main id="main-content" class="container" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="admin-footer">
        <div class="container">
            <a href="{{ url_for('public.index') }}">View Site</a>
            <span class="admin-footer-sep">|</span>
            <span>&copy; {{ current_year }} {{ site_title }}</span>
        </div>
    </footer>

    <script type="module" src="{{ vite_asset('js/main.js') }}"></script>
</body>
</html>

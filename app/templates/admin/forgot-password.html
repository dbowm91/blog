{% extends "admin/login_base.html" %}

{% block content %}
<div class="login-page">
    <div class="login-card animate-in">
        <h1>Reset Password</h1>
        <p class="login-subtitle">Enter your username to receive a password reset link.</p>
        <form method="POST" class="login-form" data-loading data-loading-text="Sending...">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="identifier">Username</label>
                <input type="text" id="identifier" name="identifier" required autocomplete="username" autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </form>
        <div class="login-footer-links">
            <a href="{{ url_for('admin.login') }}">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

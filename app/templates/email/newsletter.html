<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#24292f;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8fa;padding:40px 20px;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #d0d7de;border-radius:12px;overflow:hidden;">
  <tr>
    <td style="padding:32px 40px;border-bottom:1px solid #d0d7de;">
      <h1 style="margin:0;font-size:20px;color:#24292f;font-family:monospace;">
        <span style="color:#0969da">{</span>{{ site_title }}<span style="color:#0969da">}</span>
      </h1>
      <p style="color:#57606a;font-size:14px;margin:8px 0 0;">Latest posts</p>
    </td>
  </tr>

  {% for post in posts %}
  <tr>
    <td style="padding:24px 40px;{% if not loop.last %}border-bottom:1px solid #d0d7de;{% endif %}">
      {% if post.image %}
      <img src="{{ base_url }}/static/uploads/{{ post.image }}" width="520" style="width:100%;max-width:520px;border-radius:8px;margin-bottom:16px;" alt="{{ post.title }} cover image">
      {% else %}
      <img src="{{ base_url }}/static/img/default-post.svg" width="520" style="width:100%;max-width:520px;border-radius:8px;margin-bottom:16px;" alt="Default post cover image">
      {% endif %}
      <h2 style="margin:0 0 8px;">
        <a href="{{ base_url }}/post/{{ post.slug }}" style="color:#24292f;text-decoration:none;font-size:18px;">{{ post.title }}</a>
      </h2>
      {% if post.summary %}
      <p style="color:#57606a;font-size:14px;line-height:1.5;margin:0 0 12px;">{{ post.summary }}</p>
      {% endif %}
      <a href="{{ base_url }}/post/{{ post.slug }}" style="color:#0969da;font-size:14px;font-weight:500;text-decoration:none;">Read more &rarr;</a>
    </td>
  </tr>
  {% endfor %}

  <tr>
    <td style="padding:24px 40px;border-top:1px solid #d0d7de;">
      <p style="color:#8c959f;font-size:13px;margin:0;text-align:center;">
        <a href="{{ unsubscribe_url }}" style="color:#0969da;text-decoration:underline;">Unsubscribe</a>
      </p>
    </td>
  </tr>
</table>
</td></tr>
</table>
</body>
</html>

{% from "projects/_project_macros.html" import project_links, project_hero, project_screenshots %}

<article class="project-landing project-landing-minimal">
    <header class="project-header">
        <h1 class="project-title">{{ project.title | escape }}</h1>
        {% if project.summary %}
        <p class="project-summary">{{ project.summary }}</p>
        {% endif %}
        {{ project_links(project) }}
    </header>

    <div class="prose project-body">
        {{ project.body | markdown_safe | safe }}
    </div>

    {{ project_screenshots(project) }}
</article>

<div class="error-page animate-in">
    <div class="error-code">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>

    {% if show_search %}
    <form method="GET" action="{{ url_for('public.search') }}" class="error-search-form">
        <input type="text" name="q" placeholder="Search posts..." class="search-input" aria-label="Search">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    {% endif %}

    {% if show_suggestions and recent_posts %}
    <div class="error-suggestions">
        <h3>Recent Posts</h3>
        <ul class="error-post-list">
            {% for post in recent_posts %}
            <li><a href="{{ url_for('public.post', slug=post.slug) }}">{{ post.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <div class="error-actions">
        <a href="{{ url_for('public.index') }}" class="btn btn-primary">Back to home</a>
        <button type="button" data-history-back class="btn btn-ghost">Go back</button>
    </div>
</div>

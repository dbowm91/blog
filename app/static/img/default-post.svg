<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="600" y="280" text-anchor="middle" font-family="monospace" font-size="80" font-weight="700" fill="#1c2128">{ }</text>
  <text x="600" y="380" text-anchor="middle" font-family="monospace" font-size="28" fill="#30363d">DevLog</text>
</svg>

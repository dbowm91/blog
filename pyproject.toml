[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog"
version = "1.0.0"
description = "A self-hosted Flask blog CMS for technical writing, newsletters, feeds, analytics, and admin-managed content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "David Bowman" },
]
keywords = ["blog", "flask", "cms", "newsletter", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "flask>=3.1.3,<4.0",
    "flask-sqlalchemy>=3.1.1,<4.0",
    "flask-login>=0.6.3,<1.0",
    "flask-migrate>=4.1.0,<5.0",
    "flask-limiter>=3.5.0,<4.0",
    "flask-caching>=2.4.0,<3.0",
    "flask-compress>=1.24,<2.0",
    "flask-swagger-ui>=4.0.0,<5.0",
    "werkzeug>=3.1.6,<4.0",
    "asgiref>=3.11.1,<4.0",
    "granian>=1.0.0,<2.0",
    "markdown>=3.7,<4.0",
    "apscheduler>=3.11.2,<4.0",
    "nh3>=0.2.0,<1.0",
    "pillow>=12.2.0,<13.0",
    "celery>=5.6.3,<6.0",
    "redis>=4.5.0,<5.0",
    "filelock>=3.0.0,<4.0",
    "cryptography>=42.0.0,<43.0",
    "pyotp>=2.9.0,<3.0",
    "qrcode[pil]>=7.4.0,<8.0",
    "tinycss2>=1.5.1,<2.0",
    "prometheus-client>=0.20.0,<1.0",
    "python-dotenv>=1.0,<2.0",
    "click>=8.0,<9.0",
    "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.0",
    "pytest-playwright>=0.7.0,<1.0",
    "pytest-xdist>=3.0.0,<4.0",
    "playwright>=1.58.0,<2.0",
    "ruff>=0.8.0",
    "mypy>=2.1.0",
]
s3 = [
    "boto3>=1.35.0,<2.0",
]

[project.scripts]
devlog = "devlog_cli.main:main"

[project.urls]
Homepage = "https://github.com/dbowm91/blog"
Documentation = "https://github.com/dbowm91/blog/blob/main/DEPLOY.md"
Repository = "https://github.com/dbowm91/blog"
Issues = "https://github.com/dbowm91/blog/issues"

[tool.setuptools.packages.find]
include = ["app*", "devlog_cli*", "migrations*"]

[tool.setuptools.package-data]
"app.themes.bundled" = ["*.toml", "catalog_manifest.json", "ATTRIBUTION.md"]
"app.themes" = ["ACCESSIBILITY_EXCEPTIONS.json"]
"app" = ["templates/**/*", "static/css/**/*", "static/js/**/*", "static/dist/**/*", "static/fonts/**/*", "static/img/**/*", "config.toml.example"]
"migrations" = ["**/*.py", "alembic.ini"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["app", "devlog_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

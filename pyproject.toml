[project]
name = "devlog"
version = "1.0.0"
description = "A self-hosted Flask blog CMS for technical writing, newsletters, feeds, analytics, and admin-managed content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "David Bowman" },
]
keywords = ["blog", "flask", "cms", "newsletter", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[project.urls]
Homepage = "https://github.com/dbowm91/blog"
Documentation = "https://github.com/dbowm91/blog/blob/main/DEPLOY.md"
Repository = "https://github.com/dbowm91/blog"
Issues = "https://github.com/dbowm91/blog/issues"

[tool.setuptools.package-data]
"app.themes.bundled" = ["*.toml", "catalog_manifest.json", "ATTRIBUTION.md"]
"app.themes" = ["ACCESSIBILITY_EXCEPTIONS.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

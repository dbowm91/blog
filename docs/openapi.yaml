openapi: 3.0.3
info:
  title: DevLog REST API
  description: |
    REST API for Post, Page, Project, Tag, Series, and Subscriber Management.

    ## Authentication
    All endpoints (except `/api/track-share`) require API key authentication.
    Pass the API key via the `X-API-Key` request header.

    API access is enabled by setting either the `API_KEY` environment variable
    (grants all scopes) or by creating one or more scoped `ApiToken` records.
    Scoped tokens support exact matches, `admin:*` for full access, and category
    wildcards (e.g. `posts:*` grants `posts:read` and `posts:write`).

    ## Rate Limiting
    API endpoints are rate-limited by Flask-Limiter with per-endpoint limits:
    read endpoints allow 20 requests per minute and write endpoints allow 10
    requests per minute. A reverse proxy (e.g., nginx, Cloudflare WAF) may apply
    additional limits.
  version: 1.0.0
  contact:
    name: Blog Admin
servers:
  - url: /
    description: Current server

paths:
  /api/posts:
    get:
      summary: List posts
      description: Retrieve a paginated list of posts with optional filtering by published status.
      operationId: listPosts
      tags:
        - Posts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Items per page (default 20, max 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: published
          in: query
          description: Filter by published status
          schema:
            type: string
            enum: [true, false, yes, no, 1, 0]
      responses:
        "200":
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
              example:
                posts:
                  - id: 1
                    title: "Getting Started with Flask"
                    slug: "getting-started-with-flask"
                    body: "# Introduction\n\nFlask is a lightweight WSGI web application framework..."
                    summary: "Learn how to build web applications with Flask."
                    image: null
                    created_at: "2026-04-15T10:30:00Z"
                    updated_at: "2026-04-15T14:22:00Z"
                    published: true
                    published_at: "2026-04-15T10:30:00Z"
                    scheduled_publish_at: null
                    newsletter_sent_at: "2026-04-15T10:35:00Z"
                    newsletter_attempts: 1
                    tags: ["flask", "python", "web"]
                total: 42
                pages: 3
                page: 1
                per_page: 20
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid or missing API key"
    post:
      summary: Create a post
      description: Create a new blog post. The slug is auto-generated if not provided.
      operationId: createPost
      tags:
        - Posts
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateRequest"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
              example:
                id: 1
                title: "Getting Started with Flask"
                slug: "getting-started-with-flask"
                body: "# Introduction\n\nFlask is a lightweight WSGI web application framework..."
                summary: "Learn how to build web applications with Flask."
                image: null
                created_at: "2026-04-15T10:30:00Z"
                updated_at: "2026-04-15T14:22:00Z"
                published: false
                published_at: null
                scheduled_publish_at: null
                newsletter_sent_at: null
                newsletter_attempts: 0
                tags: ["flask", "python"]
        "400":
          description: Invalid request body or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "title and body are required"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid API key"
        "503":
          description: Search index unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Search index unavailable"


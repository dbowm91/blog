    post:
      summary: Track a share event
      description: |
        Track social share events for published posts.
        This endpoint does not require API key authentication, but it is served
        by the `public` blueprint, so global CSRF validation applies. Send the
        token as the `X-CSRF-Token` header (JSON requests) or as a `csrf_token`
        form field (multipart/form-data requests).

        Rate limited to 20 requests per minute.
      operationId: trackShare
      tags:
        - Sharing
      parameters:
        - name: X-CSRF-Token
          in: header
          description: CSRF token (auto-read from page meta tag by frontend JS)
          required: true
          schema:

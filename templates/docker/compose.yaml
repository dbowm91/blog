services:
  blog:
    image: ghcr.io/dbowm91/blog:latest
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "DevLog Blog"
      org.opencontainers.image.description: "Flask blog CMS with admin dashboard, newsletter scheduling, and FTS5 search"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - FLASK_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-${REDIS_URL:-redis://redis:6379/0}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL:-redis://redis:6379/0}}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - PROXY_COUNT=${PROXY_COUNT:-1}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-false}
      - HEALTH_CHECK_SECRET=${HEALTH_CHECK_SECRET:-}
      - METRICS_SECRET=${METRICS_SECRET:-}
      - ENABLE_METRICS=${ENABLE_METRICS:-false}
      - API_KEY=${API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - WEBHOOK_ENCRYPTION_KEY=${WEBHOOK_ENCRYPTION_KEY:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI:-}
    volumes:
      - blog_data:/home/blog/instance
      - blog_logs:/home/blog/logs
      - blog_uploads:/home/blog/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - production

  celery:
    image: ghcr.io/dbowm91/blog:latest
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "DevLog Celery Worker"
      org.opencontainers.image.description: "Async task worker for newsletters, backups, and scheduled jobs"
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-${REDIS_URL:-redis://redis:6379/0}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL:-redis://redis:6379/0}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - PYTHONPATH=/home/blog
    volumes:
      - blog_data:/home/blog/instance
      - blog_logs:/home/blog/logs
      - blog_uploads:/home/blog/app/static/uploads
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - production

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - redis_data:/data
    networks:
      - internal
    profiles:
      - production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - blog_uploads:/home/blog/app/static/uploads:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      blog:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - reverse-proxy

volumes:
  blog_data:
    name: devlog_data
  blog_logs:
    name: devlog_logs
  blog_uploads:
    name: devlog_uploads
  redis_data:
    name: devlog_redis

networks:
  internal:
    driver: bridge

[app]
title = "DevLog"
description = "A place for thoughts on code, systems, and the craft of building software."
posts_per_page = 10
max_viewed_posts = 100
session_lifetime_hours = 24
tag_cache_ttl_seconds = 60
dashboard_per_page = 20
subscribers_per_page = 50
media_per_page = 50
media_max_files = 1000
# secret_key, admin credentials, and SMTP creds are read from environment variables.
# See .env.example for required variables.

[admin]
username = "admin"
# password is read from ADMIN_PASSWORD environment variable

[server]
host = "0.0.0.0"
port = 5000
debug = false

[author]
name = "David Bowman"
role = "Software Engineer"
avatar = ""

[site]
base_url = "http://localhost:5000"
related_posts_count = 3

[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = ""
smtp_password = ""
from_address = "blog@example.com"

[newsletter]
send_time = "08:00"
confirmation_expiry_hours = 1
max_retry_attempts = 5
